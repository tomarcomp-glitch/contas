<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Contas</title>
<style>
  :root { --bg: #f4f6f8; --card: #ffffff; --text: #333333; --primary: #0e6b5c; --danger: #b23c2b; --success: #12795f; --border: #dcdcdc; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
  header { background: var(--primary); color: #fff; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
  h1 { margin: 0; font-size: 18px; }
  nav { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
  nav button { flex: 1; padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
  nav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  input, select { width: 100%; padding: 10px; margin: 5px 0 12px 0; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
  button.btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 5px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: #666; font-size: 12px; }
  .text-right { text-align: right; }
  .badge { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .badge.pago { background: #e1f5fe; color: #0277bd; }
  .badge.pendente { background: #ffebee; color: var(--danger); }
  .actions { display: flex; gap: 5px; justify-content: flex-end; }
  .actions button { padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <h1>Controle de Contas 2026</h1>
</header>

<nav>
  <button onclick="mudarTab('painel')" id="btn-painel" class="active">Painel</button>
  <button onclick="mudarTab('pagar')" id="btn-pagar">A Pagar</button>
  <button onclick="mudarTab('receber')" id="btn-receber">A Receber</button>
  <button onclick="mudarTab('novo')" id="btn-novo">+ Lançar</button>
</nav>

<div id="conteudo"></div>

<script>
  // Base de dados inicial simplificada
  let dados = JSON.parse(localStorage.getItem('contas_simples')) || [
    { id: 1, tipo: 'p', venc: '2026-10-20', pessoa: 'Mercado Livre', desc: 'Cartão de Crédito', val: 116530, status: 'pendente' },
    { id: 2, tipo: 'p', venc: '2026-10-22', pessoa: 'COPASA', desc: 'Conta de Água', val: 6790, status: 'pendente' },
    { id: 3, tipo: 'r', venc: '2026-10-20', pessoa: 'Adriano', desc: 'Empréstimo', val: 3500, status: 'pendente' }
  ];

  let tabAtual = 'painel';

  function salvar() {
    localStorage.setItem('contas_simples', JSON.stringify(dados));
  }

  function mudarTab(t) {
    tabAtual = t;
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + t).classList.add('active');
    render();
  }

  function formatarMoeda(cents) {
    return 'R$ ' + (cents / 100).toFixed(2).replace('.', ',');
  }

  function render() {
    const el = document.getElementById('conteudo');
    if (tabAtual === 'painel') {
      let totalPagar = dados.filter(i => i.tipo === 'p' && i.status === 'pendente').reduce((acc, i) => acc + i.val, 0);
      let totalReceber = dados.filter(i => i.tipo === 'r' && i.status === 'pendente').reduce((acc, i) => acc + i.val, 0);
      
      el.innerHTML = `
        <div class="card">
          <div class="row"><b>Total a Pagar:</b> <span style="color:var(--danger)">${formatarMoeda(totalPagar)}</span></div>
          <div class="row"><b>Total a Receber:</b> <span style="color:var(--success)">${formatarMoeda(totalReceber)}</span></div>
        </div>
        <div class="card">
          <h3>Próximos Vencimentos</h3>
          ${gerarTabela(dados.slice(0, 5))}
        </div>`;
    } else if (tabAtual === 'pagar' || tabAtual === 'receber') {
      let tipoFiltro = tabAtual === 'pagar' ? 'p' : 'r';
      let lista = dados.filter(i => i.tipo === tipoFiltro);
      el.innerHTML = `<div class="card"><h3>${tabAtual === 'pagar' ? 'Contas a Pagar' : 'Contas a Receber'}</h3>${gerarTabela(lista)}</div>`;
    } else if (tabAtual === 'novo') {
      el.innerHTML = `
        <div class="card">
          <h3>Novo Lançamento</h3>
          <label>Tipo:</label>
          <select id="f-tipo"><option value="p">A Pagar</option><option value="r">A Receber</option></select>
          <label>Vencimento:</label>
          <input type="date" id="f-venc" value="${new Date().toISOString().split('T')[0]}">
          <label>Favorecido / Pessoa:</label>
          <input type="text" id="f-pessoa" placeholder="Ex: CEMIG, Supermercado...">
          <label>Descrição:</label>
          <input type="text" id="f-desc" placeholder="Ex: Conta de Luz">
          <label>Valor (R$):</label>
          <input type="number" step="0.01" id="f-val" placeholder="0,00">
          <button class="btn-main" onclick="adicionarConta()">Guardar Conta</button>
        </div>`;
    }
  }

  function gerarTabela(lista) {
    if (lista.length === 0) return '<p style="color:#777; font-size:13px;">Sem registos encontrados.</p>';
    let html = `<table><tr><th>Data</th><th>Descrição</th><th class="text-right">Valor</th><th class="text-right">Ação</th></tr>`;
    lista.forEach(i => {
      let dataFmt = i.venc.split('-').reverse().join('/');
      html += `<tr>
        <td>${dataFmt}</td>
        <td><b>${i.pessoa}</b><br><small>${i.desc}</small></td>
        <td class="text-right">${formatarMoeda(i.val)}</td>
        <td class="text-right actions">
          ${i.status === 'pendente' ? `<button onclick="baixar(${i.id})" style="background:#e8f5e9; color:#2e7d32;">Baixar</button>` : ''}
          <button onclick="apagar(${i.id})" style="background:#ffebee; color:#c62828;">X</button>
        </td>
      </tr>`;
    });
    html += `</table>`;
    return html;
  }

  function adicionarConta() {
    let tipo = document.getElementById('f-tipo').value;
    let venc = document.getElementById('f-venc').value;
    let pessoa = document.getElementById('f-pessoa').value.trim();
    let desc = document.getElementById('f-desc').value.trim();
    let valStr = document.getElementById('f-val').value;

    if (!pessoa || !valStr) {
      alert('Por favor, preencha a pessoa e o valor.');
      return;
    }

    let val = Math.round(parseFloat(valStr.replace(',', '.')) * 100);

    dados.push({ id: Date.now(), tipo, venc, pessoa, desc: desc || pessoa, val, status: 'pendente' });
    salvar();
    mudarTab('painel');
  }

  function baixar(id) {
    let item = dados.find(i => i.id === id);
    if (item) {
      item.status = 'pago';
      salvar();
      render();
    }
  }

  function apagar(id) {
    if (confirm('Deseja excluir este lançamento?')) {
      dados = dados.filter(i => i.id !== id);
      salvar();
      render();
    }
  }

  render();
</script>
</body>
</html>
