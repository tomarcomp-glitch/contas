<style>
*{box-sizing:border-box}
:root{--bg:#f3f2ec;--card:#fff;--ink:#1c2a26;--mut:#5d6b66;--line:#dedcd1;--ac:#0e6b5c;--acs:#e6f1ee;--pos:#12795f;--neg:#b23c2b;--warn:#c58a1b}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1{font-size:20px;margin:0}h1 small{color:var(--mut);font-weight:400}h2{font-size:15px;margin:0 0 10px}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav a{padding:7px 12px;border-radius:8px;color:var(--ink);text-decoration:none}nav a.on{background:var(--acs);color:var(--ac);font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;min-height:34px}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.dark button.pri{color:#06201b}
@media(prefers-color-scheme:dark){button.pri{color:#06201b}}
kbd{font:11px monospace;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
main{padding:14px 18px;max-width:1280px;margin:auto}
.per{max-width:1280px;margin:12px auto 0;padding:0 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.per label{display:flex;gap:6px;align-items:center;color:var(--mut)}
.per button.on{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}.grid2 .card{margin:0}.grid2{margin-bottom:14px}
.k3,.k4{display:grid;gap:10px;margin-bottom:14px}.k3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column}.kpi span{color:var(--mut);font-size:13px}.kpi b{font-size:20px;font-variant-numeric:tabular-nums}.kpi small{color:var(--mut)}
.kpi.big b{font-size:26px}.pos b{color:var(--pos)}.neg b{color:var(--neg)}.wn b{color:var(--warn)}
.grp>h2{margin:0 0 6px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.sp{flex:1}.inl{display:flex;gap:6px;align-items:center;color:var(--mut)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

td.ac{text-align:right}td.ac button{padding:2px 8px;min-height:28px;font-size:13px;margin-left:4px}.obs{cursor:help;color:var(--mut)}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}.tag.ok{color:var(--pos)}.tag.bad{color:var(--neg)}.tag.wn{color:var(--warn)}

.fv{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-radius:6px;padding:4px 6px;background:none}.fv i{height:10px;background:var(--acs);border-radius:5px;overflow:hidden}.fv u{display:block;height:100%;background:var(--neg)}.fv.r u{background:var(--pos)}

.vazio,.mut{color:var(--mut)}.bad{color:var(--neg)}

.seg label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.sg{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}.sg span{flex:1}.sg input.sv{width:110px;text-align:right}

h3{font-size:14px;margin:0 0 8px;color:var(--mut)}.nw{padding:8px 0;border-bottom:1px solid var(--line)}.nw small{display:block;color:var(--mut)}.nw a{color:var(--ac)}.nw p{margin:2px 0 0}.leg a{color:var(--ac)}.fv{cursor:default}

function dl(nome,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();a.remove()}
function expCsv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',h=['Tipo','Vencimento','Favorecido','Descrição','Valor','Classe','Observação','Data pagamento','Valor pago','Mês','Ano','Status'];
 const rows=Store.all.slice().sort((a,b)=>a.venc.localeCompare(b.venc)).map(i=>[i.t==='r'?'Receber':'Pagar',fmtD(i.venc),i.pessoa,i.desc,fm(i.v)||'0,00',i.classe,i.obs,i.dp?fmtD(i.dp):'',fm(i.vp),+i.venc.slice(5,7),+i.venc.slice(0,4),info(i).st].map(q).join(';'));
 dl('contas_'+today()+'.csv','\ufeff'+h.map(q).join(';')+'\n'+rows.join('\n'),'text/csv')}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s),b=g('[data-a]');
 if(b){const a=b.dataset.a,tr=b.closest('tr'),id=tr&&tr.dataset.id;
  if(a==='novo')openForm(null,{t:location.hash.includes('receber')?'r':'p'});else if(a==='edit')openForm(id);else if(a==='baixa')baixa([id]);else if(a==='del')del(id);
  else if(a==='lote')baixa($$('.ck:checked').map(c=>c.closest('tr').dataset.id),$('#bxd').value);else if(a==='proj')openProj();else if(a==='fechar')$('#dlg').close();
  else if(a==='criarproj'){const k=$('#pmz').value,[y,mo]=k.split('-').map(Number);let n=0;
   $$('#sug .sg').forEach((row,ix)=>{if(!$('input[type=checkbox]',row).checked)return;const s=SUG[ix],v=pm($('.sv',row).value);if(isNaN(v))return;Store.all.push({id:uid(),t:s.t,venc:k+'-'+p2(Math.min(+s.venc.slice(8),lastDay(y,mo))),pessoa:s.pessoa,desc:s.desc,v,classe:s.classe,obs:'Projetado automaticamente',dp:'',vp:0});n++});
   Store.save();$('#dlg').close();setMes(k);render();toast(n+' conta(s) projetada(s).')}
  else if(a==='expjson')dl('contas_backup_'+today()+'.json',JSON.stringify(Store.d),'application/json');else if(a==='expcsv')expCsv();
  else if(a==='restaurar'){if(confirm('Substituir TODOS os dados atuais pelos dados originais da planilha?')){Store.d={schema:1,itens:seed()};Store.save();render();toast('Dados originais restaurados.')}}
  else if(a==='lerpaste')lerPaste();else if(a==='imppaste')impPaste();return}
 let x;if(x=g('[data-m]')){setMes(x.dataset.m);render()}
 else if(x=g('[data-pre]')){preset(x.dataset.pre);render()}
 else if(x=g('[data-fav]')){FAV=x.dataset.fav;render()}
 else if(e.target.id==='ckall')$$('.ck').forEach(c=>c.checked=e.target.checked)});
document.addEventListener('input',e=>{if(e.target.closest('#tools')){calc();return}if(e.target.id==='q'){T.q=e.target.value;$('#lista').innerHTML=listaHTML($('#lista').dataset.t)}});
document.addEventListener('change',e=>{const i=e.target.id;
 if(i==='stf'){T.st=e.target.value;$('#lista').innerHTML=listaHTML($('#lista').dataset.t)}
 else if(i==='pi'||i==='pf'){const a=$('#pi').value,b=$('#pf').value;if(a&&b&&a<=b){P={ini:a,fim:b};render()}else toast('A data inicial deve ser anterior à final.')}
 else if(i==='fjson'){const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.itens))throw 0;
  if(!confirm('Substituir os dados atuais por este backup ('+o.itens.length+' lançamentos)?'))return;
  Store.d={schema:1,itens:o.itens.map(i=>({id:i.id||uid(),t:i.t==='r'?'r':'p',venc:String(i.venc||'').slice(0,10),pessoa:String(i.pessoa||''),desc:String(i.desc||''),v:+i.v||0,classe:i.classe==='Fixa'?'Fixa':'Variável',obs:String(i.obs||''),dp:i.dp||'',vp:+i.vp||0}))};Store.save();render();toast('Backup restaurado.')}catch(x){toast('Arquivo de backup inválido.')}};r.readAsText(fl)}});
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]'),tp=$('#tip');if(t){tp.textContent=t.dataset.tip;tp.style.display='block'}else tp.style.display='none'});
document.addEventListener('mousemove',e=>{const tp=$('#tip');if(tp.style.display==='block'){tp.style.left=Math.min(e.clientX+12,innerWidth-330)+'px';tp.style.top=(e.clientY+14)+'px'}});
document.addEventListener('keydown',e=>{if(e.key==='n'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#dlg').open){e.preventDefault();openForm(null,{t:location.hash.includes('receber')?'r':'p'})}});
window.addEventListener('hashchange',render);
Store.init();setMes(ym(today()));if(!Store.all.some(inP))preset('tudo');render();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
